name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test native workflows against the real daemon
        run: node scripts/smoke-native-workflows.mjs target/debug/mlx-ollama-daemon

  preview-servers:
    name: Preview Servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated previews and invalid request paths
        run: node --test scripts/tests/preview-servers.test.mjs

  offline-presentation:
    name: Offline Presentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify portable presentation
        run: node docs/apresentacao-plugins/verify.mjs
      - name: Test presentation verifier failures
        run: node --test scripts/tests/presentation-verifier.test.mjs

  presentation-studio:
    name: Presentation Studio & Plugin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix plugins/presentation-studio
      - run: npm ci --prefix packages/plugin-sdk
      - run: npm ci --prefix apps/desktop-ui
      - run: npm test --prefix plugins/presentation-studio
      - run: npm test --prefix packages/plugin-sdk
      - run: node --check apps/desktop-ui/ui/plugin-manager.js
      - name: Test desktop workflows and plugin integration
        run: node --test apps/desktop-ui/e2e/*.test.js
      - run: npm ci --prefix plugins/reading-notes
      - name: Test connected plugin example
        working-directory: plugins/reading-notes
        run: npm test
      - run: npm run build --prefix plugins/presentation-studio
      - name: Check generated desktop bundles
        run: git diff --exit-code -- apps/desktop-ui/ui/presentation-studio.js apps/desktop-ui/ui/presentation-studio.css
