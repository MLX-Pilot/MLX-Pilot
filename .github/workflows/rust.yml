name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test native workflows against the real daemon
        run: node scripts/smoke-native-workflows.mjs target/debug/mlx-ollama-daemon
      - name: Install plugin bridge audit dependencies
        run: |
          npm ci --prefix apps/desktop-ui
          npm ci --prefix packages/plugin-sdk
      - name: Audit plugin broker, WASM limits and bridge contracts
        env:
          RELEASE_GATE_DAEMON_BIN: ${{ github.workspace }}/target/debug/mlx-ollama-daemon
          RELEASE_GATE_OUTPUT_DIR: ${{ runner.temp }}/plugin-security-audit
        run: node scripts/release-gate/plugin-security-smoke.mjs
      - name: Preserve plugin security audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-security-audit
          path: ${{ runner.temp }}/plugin-security-audit
          if-no-files-found: error

      - name: Install the Reading Notes build tools
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 -o extism.gz https://github.com/extism/js-pdk/releases/download/v1.7.0/extism-js-x86_64-linux-v1.7.0.gz
          echo '63b72da2f5e88655522dc21477de549f238a2f40546a69ce4e0fce7e78654035  extism.gz' | sha256sum --check
          curl --fail --silent --show-error --location --retry 3 -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo '2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  binaryen.tar.gz' | sha256sum --check
          tar xzf binaryen.tar.gz
          gzip -dc extism.gz > binaryen-version_133/bin/extism-js
          chmod +x binaryen-version_133/bin/extism-js
          echo "$PWD/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Build the plugin and install Chromium
        run: |
          npm ci --prefix plugins/reading-notes
          npm run build --prefix plugins/reading-notes
          npm run pack --prefix plugins/reading-notes
          npm exec --prefix apps/desktop-ui -- playwright install --with-deps chromium
      - name: Run the complete release gate and channel account UI
        env:
          RELEASE_GATE_OUTPUT_DIR: ${{ runner.temp }}/semester-release-gate
        run: |
          node scripts/release-gate/run-all.mjs
          node scripts/release-gate/channel-accounts-browser.mjs
      - name: Preserve browser recordings, exports and release results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-browser
          path: ${{ runner.temp }}/semester-release-gate
          if-no-files-found: error

  linux-package:
    name: Ubuntu desktop package (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-ui/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKitGTK and the desktop recording tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xvfb xauth dbus-x11 openbox xdotool ffmpeg python3-pyatspi
      - name: Build the Debian package
        working-directory: apps/desktop-ui
        run: npm exec --yes --package=@tauri-apps/cli@2.10.0 -- tauri build --bundles deb -- --locked
      - name: Install it, open the native window and exercise the agent
        run: /usr/bin/python3 scripts/release-gate/linux-package-smoke.py apps/desktop-ui/src-tauri/target/release/bundle/deb/*.deb "${{ runner.temp }}/linux-desktop-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-desktop-amd64
          path: |
            apps/desktop-ui/src-tauri/target/release/bundle/deb/*.deb
            ${{ runner.temp }}/linux-desktop-smoke
          if-no-files-found: error

  preview-servers:
    name: Preview Servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated previews and invalid request paths
        run: node --test scripts/tests/preview-servers.test.mjs
      - name: Test release decision and bridge audit failures
        run: node --test scripts/tests/release-gate.test.mjs scripts/tests/plugin-bridge-security.test.mjs

  offline-presentation:
    name: Offline Presentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify portable presentation
        run: node docs/apresentacao-plugins/verify.mjs
      - name: Test presentation verifier failures
        run: node --test scripts/tests/presentation-verifier.test.mjs

  presentation-studio:
    name: Presentation Studio & Plugin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix plugins/presentation-studio
      - run: npm ci --prefix packages/plugin-sdk
      - run: npm ci --prefix apps/desktop-ui
      - run: npm test --prefix plugins/presentation-studio
      - run: npm test --prefix packages/plugin-sdk
      - run: node --check apps/desktop-ui/ui/plugin-manager.js
      - name: Test desktop workflows and plugin integration
        run: node --test apps/desktop-ui/e2e/*.test.js
      - run: npm ci --prefix plugins/reading-notes
      - name: Test connected plugin example
        working-directory: plugins/reading-notes
        run: npm test
      - run: npm run build --prefix plugins/presentation-studio
      - name: Check generated desktop bundles
        run: git diff --exit-code -- apps/desktop-ui/ui/presentation-studio.js apps/desktop-ui/ui/presentation-studio.css
